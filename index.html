<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0b0f19" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HandlerCut Pro">
<title>HandlerCut Pro — Film Handler Optimizer</title>
<style>
:root{
  --bg:#0b0f19;--card:#131b2e;--inner:#0d1322;--elev:#1c2742;
  --bdr:#24314f;--bdr2:#354770;--txt:#f8fafc;--mut:#94a3b8;--dim:#64748b;
  --amb:#f59e0b;--amb2:#fbbf24;--amb-bg:rgba(245,158,11,.14);
  --em:#10b981;--em2:#34d399;--em-bg:rgba(16,185,129,.15);
  --cy:#06b6d4;--cy2:#22d3ee;--cy-bg:rgba(6,182,212,.15);
  --pur:#a855f7;--pur2:#c084fc;--pur-bg:rgba(168,85,247,.16);
  --ros:#f43f5e;--ros-bg:rgba(244,63,94,.15);--hdr:rgba(11,15,25,.94);
  --shd:0 8px 22px rgba(0,0,0,.35);
}
body.light{
  --bg:#eef2f7;--card:#ffffff;--inner:#f4f7fb;--elev:#e6ecf5;
  --bdr:#cbd5e1;--bdr2:#94a3b8;--txt:#0f172a;--mut:#475569;--dim:#64748b;
  --amb:#d97706;--amb2:#b45309;--amb-bg:rgba(217,119,6,.12);
  --em:#059669;--em2:#047857;--em-bg:rgba(5,150,105,.12);
  --cy:#0284c7;--cy2:#0369a1;--cy-bg:rgba(2,132,199,.12);
  --pur:#7e22ce;--pur2:#6b21a8;--pur-bg:rgba(126,34,206,.12);
  --ros:#dc2626;--ros-bg:rgba(220,38,38,.12);--hdr:rgba(255,255,255,.94);
  --shd:0 6px 18px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding-bottom:76px;overflow-x:hidden}
.tab{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
button{font-family:inherit;cursor:pointer;border:none;outline:none;transition:transform .1s,background .15s,border-color .15s}
button:active{transform:scale(.97)}
input,textarea{background:var(--inner);border:1px solid var(--bdr);border-radius:10px;color:var(--txt);font-family:inherit;font-size:13.5px;padding:8px 10px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--amb)}
input[type=number]{font-family:ui-monospace,monospace;font-weight:700;text-align:center;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
.hidden{display:none!important}

/* Header */
header{position:sticky;top:0;z-index:40;background:var(--hdr);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bdr);padding:10px 14px}
.hdr-in{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo-box{width:42px;height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:11px;background:var(--inner);border:1px solid var(--bdr2)}
.title-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.title{font-size:16px;font-weight:800;letter-spacing:-.02em}
.title span{color:var(--amb2)}
.sub{font-size:10px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.shop-btn{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--amb-bg);color:var(--amb2);border:1px solid rgba(245,158,11,.35);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop-add{font-size:10px;font-weight:600;padding:2px 6px;border-radius:6px;background:transparent;color:var(--dim);border:1px dashed var(--bdr)}
.shop-bar{max-width:820px;margin:8px auto 0;padding:8px;background:var(--card);border:1px solid var(--bdr2);border-radius:11px;display:flex;gap:6px}
.hdr-act{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn-ico{width:34px;height:34px;border-radius:10px;background:var(--elev);color:var(--txt);border:1px solid var(--bdr2);font-size:15px;display:flex;align-items:center;justify-content:center}
.btn-sec{background:var(--elev);color:var(--txt);border:1px solid var(--bdr2);padding:8px 11px;border-radius:10px;font-size:11.5px;font-weight:700}
.btn-cy{background:var(--cy-bg);color:var(--cy2);border:1px solid rgba(34,211,238,.35);padding:7px 11px;border-radius:10px;font-size:11.5px;font-weight:700}
.btn-pur{background:var(--pur-bg);color:var(--pur2);border:1px solid rgba(168,85,247,.38);padding:7px 11px;border-radius:10px;font-size:11.5px;font-weight:700}
.btn-pcy{background:var(--cy);color:#08101e;padding:8px 13px;border-radius:10px;font-size:12px;font-weight:800}
.btn-del{background:transparent;color:var(--mut);padding:6px 9px;border-radius:8px;font-size:11.5px;font-weight:600}
.btn-del:hover{color:var(--ros);background:var(--ros-bg)}

/* Main & Cards */
main{max-width:820px;margin:0 auto;padding:14px 12px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:15px;box-shadow:var(--shd)}
.sec-hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.sec-ttl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Pills & Rolls */
.ctrl-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:11px}
.pill-grp{display:inline-flex;align-items:center;background:var(--inner);border:1px solid var(--bdr);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.pill-lbl{font-size:11px;color:var(--mut);padding:0 6px;font-weight:600}
.pill{padding:5px 9px;border-radius:7px;font-size:11px;font-weight:800;background:transparent;color:var(--mut)}
.pill.on-amb{background:var(--amb);color:#0b0f19}
.pill.on-cy{background:var(--cy);color:#0b0f19}
.roll-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:560px){.roll-grid{grid-template-columns:repeat(5,1fr)}}
.r-tog{position:relative;background:var(--inner);border:2px solid var(--bdr);border-radius:12px;padding:11px 4px;text-align:center;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px}
.r-tog.on{background:var(--amb-bg);border-color:var(--amb);color:var(--txt)}
.r-w{font-size:17px;font-weight:800}
.r-st{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.r-tog.on .r-st{color:var(--amb2)}
.r-rm{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:50%;background:var(--ros);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cust-row{margin-top:11px;padding-top:11px;border-top:1px solid var(--bdr);display:flex;gap:8px}

/* Cut List */
.paste-box{background:var(--inner);border:1px solid rgba(34,211,238,.45);border-radius:13px;padding:11px;margin-bottom:12px}
.preset-strip{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.pre-chip{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:7px;background:var(--elev);color:var(--mut);border:1px solid var(--bdr)}
.pre-chip:hover{border-color:var(--cy);color:var(--cy2)}
.w-hdr{display:none}
@media(min-width:660px){
  .w-hdr{display:grid;grid-template-columns:2.4fr 3.2fr 1.1fr 1.5fr 1.5fr 34px;gap:8px;padding:0 4px 6px;font-size:10px;text-transform:uppercase;color:var(--dim);text-align:center}
  .w-hdr div:first-child,.w-hdr div:nth-child(2){text-align:left}
}
.w-list{display:flex;flex-direction:column;gap:8px}
.w-row{background:var(--inner);border:1px solid var(--bdr);border-radius:12px;padding:9px;display:grid;grid-template-columns:1fr 1fr 1fr 34px;gap:7px;align-items:end}
.w-film{grid-column:1 / span 2;border-color:rgba(168,85,247,.35)!important;color:var(--pur2)!important;font-weight:700}
.w-room{grid-column:3 / span 2}
.m-lbl{display:block;font-size:9px;text-transform:uppercase;color:var(--dim);text-align:center;margin-bottom:3px}
@media(min-width:660px){
  .w-row{grid-template-columns:2.4fr 3.2fr 1.1fr 1.5fr 1.5fr 34px;align-items:center;padding:7px}
  .w-film,.w-room{grid-column:auto}
  .m-lbl{display:none}
}
.act-row{margin-top:11px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-add{width:100%;padding:11px;border-radius:12px;background:transparent;border:2px dashed var(--bdr2);color:var(--txt);font-size:12.5px;font-weight:700}
.btn-add:hover{border-color:var(--amb);color:var(--amb2)}
.btn-add-grp{width:100%;padding:11px;border-radius:12px;background:var(--pur-bg);border:2px dashed rgba(168,85,247,.55);color:var(--pur2);font-size:12.5px;font-weight:700}
.btn-add-grp:hover{border-color:var(--pur2)}
.sum-ft{margin-top:11px;padding-top:11px;border-top:1px solid var(--bdr);display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-size:12px;color:var(--mut)}

/* Film Queue Stepper */
.q-bar{background:var(--card);border:1px solid var(--bdr2);border-radius:16px;padding:12px;box-shadow:var(--shd);display:flex;flex-direction:column;gap:10px}
.q-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.q-tab{flex-shrink:0;background:var(--inner);border:2px solid var(--bdr);color:var(--mut);border-radius:11px;padding:8px 12px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.q-tab.act{background:var(--pur-bg);border-color:var(--pur2);color:var(--txt)}
.q-tab.done{border-color:var(--em);color:var(--em2)}
.q-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid var(--bdr)}
.btn-next{background:var(--em);color:#06130e;padding:9px 14px;border-radius:10px;font-size:12px;font-weight:800}

/* Film Group Sections & Comparison */
.film-sec{background:var(--card);border:1px solid var(--bdr2);border-radius:18px;padding:15px;box-shadow:var(--shd);display:flex;flex-direction:column;gap:12px}
.film-hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--bdr)}
.film-bdg{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:8px;background:var(--pur-bg);color:var(--pur2);border:1px solid rgba(168,85,247,.35)}
.comp-grid{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:560px){.comp-grid{grid-template-columns:repeat(2,1fr)}}
.c-card{background:var(--inner);border:2px solid var(--bdr);border-radius:13px;padding:11px;text-align:left;color:var(--txt);display:flex;flex-direction:column;gap:7px}
.c-card.sel{background:var(--elev);border-color:var(--amb)}
.c-card.multi{border-color:rgba(168,85,247,.45)}
.c-card.multi.sel{border-color:var(--pur2)}
.c-card.bad{opacity:.5}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.bdg-best{background:var(--em);color:#06130e;font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
.bdg-mul{background:var(--pur);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;text-transform:uppercase;white-space:nowrap}
.bdg-bad{background:var(--ros-bg);color:var(--ros);font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:6px;text-transform:uppercase}
.c-stats{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);padding-top:5px;border-top:1px solid var(--bdr)}
.c-stats strong{display:block;font-size:13px;color:var(--txt);margin-top:1px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:4px}
.kpi{background:var(--inner);border:1px solid var(--bdr);border-radius:11px;padding:9px 4px;text-align:center}
.kpi span{display:block}
.strat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.s-btn{background:var(--inner);border:2px solid var(--bdr);border-radius:11px;padding:9px;text-align:left;color:var(--mut)}
.s-btn.lw{background:var(--em-bg);border-color:var(--em);color:var(--txt)}
.s-btn.fs{background:var(--cy-bg);border-color:var(--cy);color:var(--txt)}

/* Stages, Blades, SVG & Pulls */
.roll-ban{background:linear-gradient(135deg,var(--elev),var(--inner));border:1px solid var(--pur);border-radius:13px;padding:10px 13px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px}
.shift-div{position:relative;display:flex;align-items:center;justify-content:center;padding:3px 0}
.shift-ln{position:absolute;left:10px;right:10px;height:1px;background:var(--amb)}
.shift-bdg{position:relative;background:var(--bg);border:1px solid var(--amb);color:var(--amb2);font-size:11px;font-weight:800;padding:5px 12px;border-radius:999px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stg-card{background:var(--inner);border:1px solid var(--bdr);border-radius:15px;overflow:hidden}
.stg-hdr{background:var(--elev);padding:10px 14px;border-bottom:1px solid var(--bdr);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px}
.b-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:13px 14px 0}
.b-box{background:var(--card);border:2px solid var(--bdr);border-radius:12px;padding:9px 11px;display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.b-box.b1{border-color:rgba(244,63,94,.75)}
.b-box.b2{border-color:rgba(245,158,11,.75)}
.b-val{font-size:21px;font-weight:800;flex-shrink:0}
.b-park{font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;background:rgba(100,116,139,.15);padding:4px 7px;border-radius:6px;flex-shrink:0}
.svg-wrap{margin:12px 14px 0;background:var(--card);border:1px solid var(--bdr);border-radius:11px;padding:9px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.svg-wrap svg{width:100%;min-width:460px;height:auto;display:block}
.pulls{padding:14px;display:flex;flex-direction:column;gap:9px}
.p-card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:11px;cursor:pointer;user-select:none}
.p-card.chk{opacity:.45}
.p-card.chk .p-ttl{text-decoration:line-through}
.chk-box{width:22px;height:22px;border-radius:6px;border:2px solid var(--bdr2);background:var(--inner);display:flex;align-items:center;justify-content:center;color:#0b0f19;font-weight:900;font-size:13px;flex-shrink:0}
.p-card.chk .chk-box{background:var(--em);border-color:var(--em)}
.l-item{background:var(--inner);border:1px solid var(--bdr);border-radius:8px;padding:6px 9px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;font-size:12px}
.l-item.drop{color:var(--dim);border-style:dashed}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--elev);border:1px solid var(--bdr2);color:var(--txt);padding:9px 16px;border-radius:999px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="hdr-in">
    <div class="brand">
      <div class="logo-box" aria-label="HandlerCut Pro Twin-Blade Logo">
        <svg viewBox="0 0 48 48" width="36" height="36">
          <rect x="6" y="22" width="36" height="20" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
          <line x1="18" y1="22" x2="18" y2="42" stroke="#f43f5e" stroke-width="1.4" stroke-dasharray="2.5 2"/>
          <line x1="31" y1="22" x2="31" y2="42" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="2.5 2"/>
          <rect x="3" y="11" width="42" height="9" rx="2.5" fill="#475569" stroke="#94a3b8" stroke-width="1"/>
          <rect x="3" y="9" width="3" height="13" rx="1" fill="#22d3ee"/>
          <polygon points="15,7 21,7 19.5,24 16.5,24" fill="#f43f5e"/>
          <polygon points="28,7 34,7 32.5,24 29.5,24" fill="#f59e0b"/>
        </svg>
      </div>
      <div>
        <div class="title-row">
          <div class="title">HandlerCut <span>Pro</span></div>
          <span id="shop-slot"></span>
        </div>
        <div class="sub mono">72" Left-Stop (0") • 2 Blades • Cut Queue</div>
      </div>
    </div>
    <div class="hdr-act">
      <button type="button" id="btn-theme" class="btn-ico" title="Toggle Light/Dark Mode">☀️</button>
      <button type="button" id="btn-demo" class="btn-sec">Demo Job</button>
    </div>
  </div>
  <div id="shop-bar" class="shop-bar hidden">
    <input type="text" id="shop-in" placeholder="Optional shop name (leave blank to hide)" maxlength="40">
    <button type="button" id="btn-shop-save" class="btn-pcy" style="white-space:nowrap">Save</button>
    <button type="button" id="btn-shop-clr" class="btn-del" style="white-space:nowrap">Clear</button>
  </div>
</header>

<main>
  <!-- 1. WINDOW CUT LIST -->
  <section class="card">
    <div class="sec-hdr">
      <div class="sec-ttl mono"><span class="dot" style="background:var(--cy)"></span>1. Window Cut List</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button type="button" id="btn-paste-tog" class="btn-cy">📋 Quick Paste Note</button>
        <button type="button" id="btn-clr-win" class="btn-del">Clear</button>
      </div>
    </div>

    <div id="paste-box" class="paste-box hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;font-weight:700;color:var(--cy2)">
        <span>Paste note with headers (Blackout, Ceramic 35, White Frost, DR 20, EV, [Decorative]):</span>
        <button type="button" id="btn-paste-x" style="background:none;color:var(--mut);font-size:12px">Close ✕</button>
      </div>
      <div class="preset-strip" id="sample-notes">
        <button type="button" data-sample="queue" class="pre-chip mono">Load Sample: Blackout + Ceramic 35 + White Frost</button>
        <button type="button" data-sample="mixed" class="pre-chip mono">Load Sample: Black + DR + Frost</button>
      </div>
      <textarea id="paste-txt" class="mono" rows="6" placeholder="Blackout&#10;(2) 12x20&#10;(4) 10x18&#10;Ceramic 35&#10;(4) 18x36&#10;(2) 18x70&#10;White Frost&#10;(2) 30x56"></textarea>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px">
        <button type="button" id="btn-paste-app" class="btn-sec">Append</button>
        <button type="button" id="btn-paste-rep" class="btn-pcy">Replace Cut List</button>
      </div>
    </div>

    <datalist id="film-presets">
      <option value="Ceramic 35"></option>
      <option value="Blackout"></option>
      <option value="White Frost"></option>
      <option value="Dual Reflective (DR)"></option>
      <option value="Evening View (EV)"></option>
      <option value="Frost"></option>
      <option value="Security"></option>
    </datalist>

    <div class="w-hdr mono"><div>Film Type</div><div>Room / Label</div><div>Qty</div><div>Width"</div><div>Height"</div><div></div></div>
    <div id="w-list" class="w-list"></div>

    <div class="act-row">
      <button type="button" id="btn-add-win" class="btn-add">+ Add Window Measurement</button>
      <button type="button" id="btn-add-grp" class="btn-add-grp">+ Add Film Group</button>
    </div>
    <div id="in-sum" class="sum-ft mono"></div>
  </section>

  <!-- 2. ROLLS ON HAND -->
  <section id="rolls-sec" class="card hidden">
    <div class="sec-hdr">
      <div id="rolls-title" class="sec-ttl mono"><span class="dot" style="background:var(--amb)"></span>2. Rolls On Hand</div>
    </div>
    <div class="ctrl-bar">
      <div class="pill-grp">
        <span class="pill-lbl">Extra Margin:</span>
        <button type="button" id="b-0" class="pill mono on-amb">+0"</button>
        <button type="button" id="b-1" class="pill mono">+1"</button>
      </div>
      <div class="pill-grp">
        <span class="pill-lbl">Max Side-Trim:</span>
        <button type="button" data-trim="2" class="pill mono">2"</button>
        <button type="button" data-trim="3" class="pill mono">3"</button>
        <button type="button" data-trim="4" class="pill mono on-cy">4"</button>
        <button type="button" data-trim="6" class="pill mono">6"</button>
      </div>
      <div class="pill-grp">
        <span class="pill-lbl">Max Tail:</span>
        <button type="button" data-tail="2" class="pill mono">2"</button>
        <button type="button" data-tail="3" class="pill mono">3"</button>
        <button type="button" data-tail="4" class="pill mono on-amb">4"</button>
        <button type="button" data-tail="6" class="pill mono">6"</button>
        <button type="button" data-tail="8" class="pill mono">8"</button>
      </div>
    </div>
    <div id="roll-grid" class="roll-grid"></div>
    <div class="cust-row">
      <input type="number" id="cust-roll" placeholder="Custom roll width (e.g. 54)" min="10" max="72" step="0.5">
      <button type="button" id="btn-add-roll" class="btn-sec" style="white-space:nowrap;color:var(--amb2)">+ Add Roll</button>
    </div>
  </section>

  <!-- 3. RESULTS -->
  <section id="results" style="display:flex;flex-direction:column;gap:16px"></section>
</main>

<div id="toast" class="toast">Updated</div>

<script>
(function(){
'use strict';
const MAX_W = 72;
let uid = 20;

const S = {
  defaultRolls: [
    { w: 72, on: true, cust: false },
    { w: 60, on: true, cust: false },
    { w: 48, on: false, cust: false },
    { w: 36, on: true, cust: false }
  ],
  rollsByFilm: {},
  activeFilm: '',
  bleed: 0,
  trim: 4,
  tail: 4,
  wins: [],
  selByFilm: {},
  stratByFilm: {},
  checked: {},
  shop: ''
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let tTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(tTimer);
  tTimer = setTimeout(() => el.classList.remove('show'), 2100);
}

function getFilmOrder(){
  const order = [];
  S.wins.forEach(w => {
    const f = (w.film || 'Standard Film').trim() || 'Standard Film';
    if(!order.includes(f)) order.push(f);
  });
  return order;
}

function getCurrentFilm(){
  const order = getFilmOrder();
  if(!order.length) return '';
  if(!S.activeFilm || !order.includes(S.activeFilm)) S.activeFilm = order[0];
  return S.activeFilm;
}

function getRollsForFilm(film){
  const key = (film || 'Standard Film').trim() || 'Standard Film';
  if(!S.rollsByFilm[key]){
    S.rollsByFilm[key] = S.defaultRolls.map(r => ({ ...r }));
  }
  return S.rollsByFilm[key];
}

/* Theme & Optional Shop Name */
function setTheme(t){
  const lt = t === 'light';
  document.body.classList.toggle('light', lt);
  $('btn-theme').textContent = lt ? '🌙' : '☀️';
  $('meta-theme').setAttribute('content', lt ? '#eef2f7' : '#0b0f19');
  try { localStorage.setItem('hc_theme', lt ? 'light' : 'dark'); } catch(_){}
}

function renderShop(){
  const slot = $('shop-slot');
  const v = (S.shop || '').trim();
  slot.innerHTML = v
    ? `<button type="button" id="b-shop-ed" class="shop-btn mono">${esc(v)} ✎</button>`
    : `<button type="button" id="b-shop-ed" class="shop-add mono">+ Add Shop Name</button>`;
  $('b-shop-ed').onclick = () => {
    const bar = $('shop-bar');
    bar.classList.toggle('hidden');
    if(!bar.classList.contains('hidden')){ $('shop-in').value = S.shop; $('shop-in').focus(); }
  };
}

function saveShop(val){
  S.shop = (val || '').trim().slice(0, 40);
  try { S.shop ? localStorage.setItem('hc_shop', S.shop) : localStorage.removeItem('hc_shop'); } catch(_){}
  renderShop();
  $('shop-bar').classList.add('hidden');
  toast(S.shop ? `Shop set: ${S.shop}` : 'Shop name hidden');
}

/* Section 1: Rolls & Controls */
function renderRolls(){
  const curFilm = getCurrentFilm();
  const titleEl = $('rolls-title');
  if(titleEl){
    titleEl.innerHTML = curFilm
      ? `<span class="dot" style="background:var(--amb)"></span>2. Rolls On Hand — <span style="color:var(--pur2)">${esc(curFilm)}</span>`
      : `<span class="dot" style="background:var(--amb)"></span>2. Rolls On Hand`;
  }
  const list = curFilm ? getRollsForFilm(curFilm) : S.defaultRolls;
  const sorted = [...list].sort((a,b) => b.w - a.w);
  $('roll-grid').innerHTML = sorted.map(r => `
    <button type="button" data-tog="${r.w}" class="r-tog ${r.on ? 'on' : ''}">
      <span class="r-w mono">${r.w}"</span>
      <span class="r-st mono">${r.on ? 'On Hand' : 'Off'}</span>
      ${r.cust ? `<span data-rm="${r.w}" class="r-rm">✕</span>` : ''}
    </button>
  `).join('');
}

function setBleed(v, notify=true){
  S.bleed = v;
  $('b-0').className = 'pill mono' + (v===0 ? ' on-amb' : '');
  $('b-1').className = 'pill mono' + (v===1 ? ' on-amb' : '');
  updateSum();
  renderAll();
  if(notify) toast(v===0 ? 'Exact sizes (+0")' : 'Added +1" margin to W & H');
}

function syncTrim(){
  document.querySelectorAll('[data-trim]').forEach(b => {
    b.className = 'pill mono' + (+b.dataset.trim === S.trim ? ' on-cy' : '');
  });
}

function syncTail(){
  document.querySelectorAll('[data-tail]').forEach(b => {
    b.className = 'pill mono' + (+b.dataset.tail === S.tail ? ' on-amb' : '');
  });
}

/* Section 2: Window Cut List & Context-Aware Multi-Film Parser */
function renderWins(){
  const el = $('w-list');
  if(!S.wins.length){
    el.innerHTML = `<div style="text-align:center;padding:20px;border-radius:11px;background:var(--inner);border:1px solid var(--bdr);color:var(--dim);font-size:13px">No measurements yet. Tap "+ Add Window Measurement", "+ Add Film Group", or "Quick Paste Note".</div>`;
    updateSum();
    return;
  }
  el.innerHTML = S.wins.map(w => `
    <div class="w-row" data-id="${w.id}">
      <div class="w-film"><span class="m-lbl mono">Film</span><input type="text" list="film-presets" data-f="film" value="${esc(w.film || 'Standard Film')}" placeholder="Film Type"></div>
      <div class="w-room"><span class="m-lbl mono">Room</span><input type="text" data-f="room" value="${esc(w.room)}" placeholder="Room / Label"></div>
      <div><span class="m-lbl mono">Qty</span><input type="number" style="color:var(--amb2)" data-f="qty" value="${w.qty}" min="1" max="200"></div>
      <div><span class="m-lbl mono">Width"</span><input type="number" data-f="w" value="${w.w}" min="1" max="144" step="0.25"></div>
      <div><span class="m-lbl mono">Height"</span><input type="number" data-f="h" value="${w.h}" min="1" max="240" step="0.25"></div>
      <div style="display:flex;justify-content:center"><button type="button" class="btn-del" data-del="${w.id}">✕</button></div>
    </div>
  `).join('');
  updateSum();
}

function updateSum(){
  let cnt = 0, area = 0;
  const films = new Set();
  S.wins.forEach(w => {
    cnt += w.qty;
    area += (w.w + S.bleed) * (w.h + S.bleed) * w.qty;
    films.add((w.film || 'Standard Film').trim() || 'Standard Film');
  });
  $('in-sum').innerHTML = `<span>Film Queue: <strong style="color:var(--pur2)">${films.size}</strong> • Panes: <strong style="color:var(--txt)">${cnt}</strong></span><span>Net Glass: <strong style="color:var(--cy2)">${(area/144).toFixed(1)} sq ft</strong></span>`;
}

function normalizeFilmName(raw){
  let t = (raw || '').replace(/^[-–—:*#\s]+|[-–—:*#\s]+$/g, '').trim();
  if(/^\[(.+)\]$/.test(t)) t = t.replace(/^\[|\]$/g, '').trim();
  t = t.replace(/^film\s*[:\-]\s*/i, '').trim();
  if(!t) return '';
  const low = t.toLowerCase();
  if(/^(dual\s*reflective|dr)(\s*\d+)?$/i.test(low)) return t.toUpperCase().startsWith('DR') ? t.toUpperCase() : `Dual Reflective (${t})`;
  if(/^(evening\s*view|ev)(\s*\d+)?$/i.test(low)) return t.toUpperCase().startsWith('EV') ? t.toUpperCase() : `Evening View (${t})`;
  if(/^white\s*frost$/i.test(low)) return 'White Frost';
  if(/^frost(ed)?(\s+.*)?$/i.test(low)) return /frost/i.test(t) ? t : 'Frost';
  if(/^black\s*out$/i.test(low)) return 'Blackout';
  return t;
}

function extractInlineFilmAndRoom(labelText, activeFilm){
  const txt = (labelText || '').replace(/^[-–—:]+|[-–—:]+$/g, '').trim();
  if(!txt) return { film: activeFilm, room: 'Window' };
  const bracket = txt.match(/\[([^\]]+)\]/);
  if(bracket){
    const film = normalizeFilmName(bracket[1]) || activeFilm;
    const room = txt.replace(bracket[0], '').replace(/^[-–—:\s]+|[-–—:\s]+$/g, '').trim() || 'Window';
    return { film, room };
  }
  const known = txt.match(/\b(ceramic\s*\d*|blackout|white\s*frost|dual\s*reflective(?:\s*\d+)?|\bdr\s*\d*\b|evening\s*view(?:\s*\d+)?|\bev\s*\d*\b|frost(?:ed)?|security)\b/i);
  if(known){
    const film = normalizeFilmName(known[0]) || activeFilm;
    const room = txt.replace(known[0], '').replace(/^[-–—:\s]+|[-–—:\s]+$/g, '').trim() || 'Window';
    return { film, room };
  }
  return { film: activeFilm, room: txt };
}

function parsePaste(replace){
  const raw = $('paste-txt').value.trim();
  if(!raw) return toast('Paste your notes first');
  let activeFilm = 'Standard Film';
  let lastRoom = 'Window';
  const out = [];
  const rx = /(?:^|[\s\-–—:]+)(?:\(?(\d+)\)?\s*[xX*]?\s*)?(\d+(?:\.\d+)?)\s*[xX*×]\s*(\d+(?:\.\d+)?)(?:\s*\(?(\d+)\)?)?/; // <-- UPDATED (allows room label before dimensions)

  for(const ln of raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)){
    const cl = ln.replace(/~?\d+(?:\.\d+)?\s*sq\s*ft/i,'').trim();
    const m = cl.match(rx);
    if(m){
      const qty = parseInt(m[1]||m[4]||'1',10);
      const w = parseFloat(m[2]);
      const h = parseFloat(m[3]);
      const before = cl.slice(0, m.index).trim(); // <-- ADDED
      const after = cl.slice(m.index + m[0].length).trim(); // <-- ADDED
      const rest = [before, after].filter(Boolean).join(' ').trim(); // <-- UPDATED
      if(qty>0 && w>0 && h>0){
        if(rest){
          const ex = extractInlineFilmAndRoom(rest, activeFilm);
          lastRoom = ex.room;
          out.push({ id: uid++, film: ex.film, room: ex.room, qty, w, h });
        } else {
          out.push({ id: uid++, film: activeFilm, room: lastRoom, qty, w, h });
        }
      }
    } else {
      const isFilmHeader = /^(film\s*:|\[.+\]|[-–—]{2,}|black\s*film|white\s*frost|ceramic|blackout|dual\s*reflective|\bdr\b|evening\s*view|\bev\b|frost|security|decorative)/i.test(cl);
      if(isFilmHeader || !out.length){
        const norm = normalizeFilmName(cl);
        if(norm){
          activeFilm = norm;
          lastRoom = 'Window';
        }
      } else {
        const ex = extractInlineFilmAndRoom(cl, activeFilm);
        if(ex.film !== activeFilm){
          activeFilm = ex.film;
        }
        lastRoom = ex.room.replace(/[:\-]+$/,'').trim() || lastRoom;
      }
    }
  }
  if(!out.length) return toast('No "W x H" measurements detected');
  S.wins = replace ? out : [...S.wins, ...out];
  if(replace) S.activeFilm = out[0].film;
  $('paste-txt').value = '';
  $('paste-box').classList.add('hidden');
  S.checked = {};
  renderWins(); renderAll();
  toast(`Imported ${out.length} measurement(s)`);
}

/* =========================================================================
   OPTIMIZER ENGINE: 2-Blade Left-Aligned + Tail Allowance + Multi-Stage + Multi-Roll
   ========================================================================= */
function getBlades(lanes, rw){
  const act = lanes.reduce((a,b)=>a+b, 0);
  let b1 = null, b2 = null;
  if(lanes.length === 1 && lanes[0] < rw) b1 = lanes[0];
  else if(lanes.length === 2){ b1 = lanes[0]; if(lanes[0]+lanes[1] < rw) b2 = lanes[0]+lanes[1]; }
  else if(lanes.length === 3){ b1 = lanes[0]; b2 = lanes[0]+lanes[1]; }
  return { b1, b2, act, sideWaste: Math.max(0, Math.round((rw - act)*100)/100) };
}

function fitStrip(p, sw, maxTrim){
  const opts = [];
  if(p.w <= sw + 1e-6 && sw - p.w <= maxTrim + 1e-6) opts.push({ sw: p.w, ph: p.h, rot: false, slk: Math.max(0, sw - p.w) });
  if(p.h <= sw + 1e-6 && sw - p.h <= maxTrim + 1e-6) opts.push({ sw: p.h, ph: p.w, rot: true,  slk: Math.max(0, sw - p.h) });
  if(!opts.length) return null;
  opts.sort((a,b) => Math.abs(a.ph - b.ph) > 1e-6 ? a.ph - b.ph : a.slk - b.slk);
  return opts[0];
}

function fitCfg(p, lanes, maxTrim){
  let best = null;
  for(let i=0; i<lanes.length; i++){
    const f = fitStrip(p, lanes[i], maxTrim);
    if(!f) continue;
    const sc = f.ph * 1000 + f.slk;
    if(!best || sc < best.sc) best = { ...f, lIdx: i, sc };
  }
  return best;
}

function packCfg(panes, lanes, rw, maxTrim, maxTail = S.tail){
  const items = [];
  for(const p of panes){
    const best = fitCfg(p, lanes, maxTrim);
    if(!best) return null;
    const valid = [];
    lanes.forEach((lw, i) => { const f = fitStrip(p, lw, maxTrim); if(f) valid.push({ ...f, lIdx: i }); });
    items.push({ p, best, valid });
  }
  const rem = [...items].sort((a,b) => Math.abs(b.best.ph - a.best.ph) > 1e-6 ? b.best.ph - a.best.ph : b.best.sw - a.best.sw);
  const pulls = [];
  while(rem.length){
    const anc = rem.shift();
    const slots = new Array(lanes.length).fill(null);
    slots[anc.best.lIdx] = { p: anc.p, f: anc.best };
    for(let l=0; l<lanes.length; l++){
      if(slots[l]) continue;
      let bi = -1, bo = null, bp = Infinity;
      for(let i=0; i<rem.length; i++){
        const opt = rem[i].valid.find(v => v.lIdx === l);
        if(!opt) continue;
        const diff = Math.abs(opt.ph - anc.best.ph);
        const overTail = Math.max(0, diff - maxTail);
        const pen = diff * 10 + overTail * 250 + (opt.ph > anc.best.ph ? (opt.ph - anc.best.ph)*50 : 0) + opt.slk;
        if(pen < bp){ bp = pen; bi = i; bo = opt; }
      }
      if(bi !== -1){ const ch = rem.splice(bi,1)[0]; slots[l] = { p: ch.p, f: bo }; }
    }
    const len = Math.max(...slots.map(s => s ? s.f.ph : 0));
    pulls.push({ len, slots });
  }
  let tailIn = 0, overTailIn = 0;
  for(const pl of pulls){
    for(let l=0; l<lanes.length; l++){
      const t = pl.slots[l] ? Math.max(0, pl.len - pl.slots[l].f.ph) : pl.len;
      tailIn += t;
      if(t > maxTail + 1e-6) overTailIn += (t - maxTail);
    }
  }
  const pullIn = pulls.reduce((s,x)=>s+x.len, 0);
  return { lanes, blades: getBlades(lanes, rw), pulls, pullIn, tailIn, overTailIn, filmSqIn: pullIn * rw };
}

function genConfigs(rw, panes){
  const ws = new Set();
  panes.forEach(p => { if(p.w <= rw) ws.add(p.w); if(p.h <= rw) ws.add(p.h); });
  [rw/2, rw/3].forEach(v => { const r = Math.round(v*100)/100; if(r>0 && r<=rw) ws.add(r); });
  const arr = [...ws].sort((a,b)=>b-a), cfgs = [];
  for(let i=0; i<arr.length; i++){
    cfgs.push([arr[i]]);
    for(let j=i; j<arr.length; j++){
      if(arr[i]+arr[j] <= rw+1e-6){
        cfgs.push([arr[i], arr[j]]);
        for(let k=j; k<arr.length; k++) if(arr[i]+arr[j]+arr[k] <= rw+1e-6) cfgs.push([arr[i], arr[j], arr[k]]);
      }
    }
  }
  return cfgs;
}

function solveStages(panes, cfgs, rw, maxTrim){
  let best1 = null;
  for(const lim of [maxTrim, Infinity]){
    for(const c of cfgs){
      const pk = packCfg(panes, c, rw, lim, S.tail);
      if(!pk) continue;
      const bc = (pk.blades.b1!==null?1:0) + (pk.blades.b2!==null?1:0);
      const sc = pk.filmSqIn*100 + pk.overTailIn*4000 + pk.pulls.length*10 + bc;
      if(!best1 || sc < best1.sc) best1 = { ...pk, sc };
    }
    if(best1) break;
  }

  let unp = [...panes], stages = [], guard = 0;
  while(unp.length && guard++ < 10){
    let bestB = null;
    for(const c of cfgs){
      const fit = unp.filter(p => fitCfg(p, c, maxTrim));
      if(!fit.length) continue;
      const ex = unp.filter(p => { const f = fitCfg(p, c, maxTrim); return f && f.slk === 0; });
      for(const sub of (ex.length ? [ex, fit] : [fit])){
        const pk = packCfg(sub, c, rw, maxTrim, S.tail);
        if(!pk) continue;
        const net = sub.reduce((s,p)=>s+p.area, 0);
        const sc = (net/pk.filmSqIn)*1000 + sub.length*25 - (pk.filmSqIn-net)*0.02 - pk.overTailIn*35;
        if(!bestB || sc > bestB.sc) bestB = { pk, sub, sc };
      }
    }
    if(!bestB) break;
    stages.push(bestB.pk);
    const used = new Set(bestB.sub.map(p=>p.id));
    unp = unp.filter(p => !used.has(p.id));
  }

  if(!unp.length && stages.length > 1 && best1){
    const mSq = stages.reduce((s,x)=>s+x.filmSqIn, 0);
    const mOver = stages.reduce((s,x)=>s+x.overTailIn, 0);
    if(best1.filmSqIn - mSq > 144 || best1.overTailIn - mOver > S.tail) return stages;
  }
  return best1 ? [best1] : null;
}

function finalizeRoll(setups, rw, panes){
  const netSqIn = panes.reduce((s,p)=>s+p.area, 0);
  const pullIn = setups.reduce((s,x)=>s+x.pullIn, 0);
  const filmSqIn = setups.reduce((s,x)=>s+x.filmSqIn, 0);
  const pullCnt = setups.reduce((s,x)=>s+x.pulls.length, 0);
  const wasteSqIn = Math.max(0, filmSqIn - netSqIn);
  return {
    rw, setups: setups.map((x,i)=>({...x, num:i+1})),
    pullIn, ft: pullIn/12, filmSf: filmSqIn/144, netSf: netSqIn/144,
    wasteSf: wasteSqIn/144, wastePct: filmSqIn>0 ? (wasteSqIn/filmSqIn)*100 : 0,
    pullCnt, filmSqIn, netSqIn
  };
}

function solveRoll(rw, panes){
  const over = panes.filter(p => Math.min(p.w, p.h) > rw);
  if(over.length) return { rw, ok: false, reason: `${over.length} pane(s) exceed ${rw}" roll width.` };
  const cfgs = genConfigs(rw, panes);
  const lw = finalizeRoll(solveStages(panes, cfgs, rw, S.trim), rw, panes);

  const oneB = cfgs.filter(c => { const b = getBlades(c, rw); return (b.b1!==null?1:0)+(b.b2!==null?1:0) <= 1; });
  let bestFs = null, bestSc = Infinity;
  for(const c of oneB){
    const s1 = panes.filter(p => fitCfg(p, c, S.trim));
    if(!s1.length) continue;
    const pk1 = packCfg(s1, c, rw, S.trim, S.tail);
    if(!pk1) continue;
    const u1 = new Set(s1.map(p=>p.id));
    const rem = panes.filter(p => !u1.has(p.id));
    let all = [pk1];
    if(rem.length){
      const s2 = solveStages(rem, cfgs, rw, S.trim);
      if(!s2) continue;
      all = [pk1, ...s2];
    }
    const fSq = all.reduce((s,x)=>s+x.filmSqIn, 0);
    const pCnt = all.reduce((s,x)=>s+x.pulls.length, 0);
    const oTail = all.reduce((s,x)=>s+x.overTailIn, 0);
    const sc = fSq*100 + oTail*4000 + pCnt*10 - s1.length*40 + (c.length===2 ? Math.abs(c[0]-c[1])*0.05 : 0);
    if(sc < bestSc){ bestSc = sc; bestFs = all; }
  }
  let fs = null;
  if(bestFs){
    const cand = finalizeRoll(bestFs, rw, panes);
    const same = cand.setups.length === lw.setups.length && cand.setups.every((x,i)=>x.blades.b1===lw.setups[i].blades.b1 && x.blades.b2===lw.setups[i].blades.b2);
    if(!same) fs = cand;
  }
  return { rw, ok: true, lw, fs };
}

function aggAllocs(allocs){
  const pullIn = allocs.reduce((s,a)=>s+a.pullIn, 0);
  const filmSqIn = allocs.reduce((s,a)=>s+a.filmSqIn, 0);
  const netSqIn = allocs.reduce((s,a)=>s+a.netSqIn, 0);
  const pullCnt = allocs.reduce((s,a)=>s+a.pullCnt, 0);
  const wasteSqIn = Math.max(0, filmSqIn - netSqIn);
  return {
    allocs, pullIn, ft: pullIn/12, filmSf: filmSqIn/144, netSf: netSqIn/144,
    wasteSf: wasteSqIn/144, wastePct: filmSqIn>0 ? (wasteSqIn/filmSqIn)*100 : 0,
    pullCnt, filmSqIn
  };
}

function findMultiPlans(activeRolls, panes){
  if(activeRolls.length < 2 || panes.length < 2) return [];
  const gMap = new Map();
  panes.forEach(p => {
    const k = `${Math.min(p.w,p.h)}x${Math.max(p.w,p.h)}`;
    if(!gMap.has(k)) gMap.set(k, []);
    gMap.get(k).push(p);
  });
  let grps = [...gMap.values()];
  if(grps.length < 2) return [];
  if(grps.length > 7){
    grps.sort((a,b)=>Math.min(b[0].w,b[0].h)-Math.min(a[0].w,a[0].h));
    while(grps.length > 7){ const t = grps.pop(); grps[grps.length-1].push(...t); }
  }
  const rws = [...activeRolls].sort((a,b)=>b-a);
  const total = Math.pow(rws.length, grps.length);
  const bestByCombo = new Map();

  for(let m=0; m<total; m++){
    let tmp = m, bkts = new Map(), ok = true;
    for(let g=0; g<grps.length; g++){
      const rw = rws[tmp % rws.length];
      tmp = Math.floor(tmp / rws.length);
      if(Math.min(grps[g][0].w, grps[g][0].h) > rw){ ok = false; break; }
      if(!bkts.has(rw)) bkts.set(rw, []);
      bkts.get(rw).push(...grps[g]);
    }
    if(!ok || bkts.size < 2 || bkts.size > 3) continue;
    const usedRws = [...bkts.keys()].sort((a,b)=>b-a);
    const lwA = [], fsA = [];
    let hasFs = false, bOk = true;
    for(const rw of usedRws){
      const res = solveRoll(rw, bkts.get(rw));
      if(!res.ok){ bOk = false; break; }
      lwA.push(res.lw);
      if(res.fs){ fsA.push(res.fs); hasFs = true; } else fsA.push(res.lw);
    }
    if(!bOk) continue;
    const key = usedRws.join('+');
    const lwAgg = aggAllocs(lwA);
    const prev = bestByCombo.get(key);
    if(!prev || lwAgg.filmSqIn < prev.lw.filmSqIn - 1e-3){
      const desc = lwA.map(a => `${a.rw}" (${a.setups.reduce((s,st)=>s+st.pulls.reduce((ps,p)=>ps+p.slots.filter(Boolean).length,0),0)}p)`).join(', ');
      bestByCombo.set(key, {
        id: `multi-${key}`, multi: true, rws: usedRws,
        label: usedRws.map(w=>`${w}"`).join(' + ') + ' Rolls',
        sub: `Split across ${usedRws.length} rolls: ${desc}`,
        ok: true, lw: lwAgg, fs: hasFs ? aggAllocs(fsA) : null
      });
    }
  }
  return [...bestByCombo.values()];
}

/* =========================================================================
   SINGLE-FILM CUT QUEUE RENDERING
   ========================================================================= */
function renderAll(){
  const rollsSec = $('rolls-sec'); // <-- ADDED
  if(rollsSec) rollsSec.classList.toggle('hidden', !S.wins.length); // <-- ADDED
  renderRolls();
  const resEl = $('results');
  if(!S.wins.length){
    resEl.innerHTML = `<div class="card" style="text-align:center;color:var(--mut);font-size:13px">Add at least one window measurement above to optimize cuts.</div>`;
    return;
  }

  const filmOrder = getFilmOrder();
  const curFilm = getCurrentFilm();
  const fIdx = filmOrder.indexOf(curFilm);

  const filmBuckets = new Map();
  filmOrder.forEach(f => filmBuckets.set(f, []));
  S.wins.forEach(w => {
    const fName = (w.film || 'Standard Film').trim() || 'Standard Film';
    const ew = Math.round((w.w + S.bleed)*100)/100, eh = Math.round((w.h + S.bleed)*100)/100;
    for(let i=0; i<w.qty; i++) filmBuckets.get(fName).push({ id: `${w.id}-${i}`, film: fName, room: w.room || 'Window', w: ew, h: eh, area: ew*eh });
  });

  const activeRolls = getRollsForFilm(curFilm).filter(r => r.on).map(r => r.w);
  const panes = filmBuckets.get(curFilm) || [];

  const qTabs = filmOrder.map((f, idx) => {
    const isAct = f === curFilm;
    const pCount = filmBuckets.get(f).length;
    return `<button type="button" data-qfilm="${esc(f)}" class="q-tab ${isAct ? 'act' : ''}">
      <span class="mono">${idx + 1}.</span>
      <span>${esc(f)}</span>
      <span class="mono" style="font-size:10px;opacity:.75">(${pCount}p)</span>
    </button>`;
  }).join('');

  const prevFilm = fIdx > 0 ? filmOrder[fIdx - 1] : null;
  const nextFilm = fIdx < filmOrder.length - 1 ? filmOrder[fIdx + 1] : null;

  const queueBar = `
    <div class="q-bar">
      <div class="sec-hdr" style="margin-bottom:0">
        <div class="sec-ttl mono"><span class="dot" style="background:var(--pur)"></span>3. Cut Queue (${fIdx + 1} of ${filmOrder.length})</div>
        <span class="mono" style="font-size:10.5px;color:var(--mut)">Showing 1 film at a time</span>
      </div>
      <div class="q-pills">${qTabs}</div>
      ${filmOrder.length > 1 ? `
        <div class="q-nav">
          ${prevFilm ? `<button type="button" data-qfilm="${esc(prevFilm)}" class="btn-sec">← ${esc(prevFilm)}</button>` : `<span></span>`}
          ${nextFilm ? `<button type="button" data-qfilm="${esc(nextFilm)}" class="btn-next">Done w/ ${esc(curFilm)} → Next: ${esc(nextFilm)}</button>` : `<span class="mono" style="font-size:11px;color:var(--em2);font-weight:800">✓ Final Film in Queue</span>`}
        </div>` : ''}
    </div>`;

  if(!activeRolls.length){
    resEl.innerHTML = queueBar + `<div class="card" style="text-align:center;color:var(--amb2);font-weight:700">Select at least one roll width above for <span style="color:var(--pur2)">${esc(curFilm)}</span>.</div>`;
    return;
  }

  const built = buildFilmSection(curFilm, fIdx, filmOrder.length, panes, activeRolls);
  resEl.innerHTML = queueBar + built.html;
}

function buildFilmSection(fName, fIdx, totalFilms, panes, activeRolls){
  const singlePlans = activeRolls.map(rw => {
    const r = solveRoll(rw, panes);
    if(!r.ok) return { id: `single-${rw}`, multi: false, rws: [rw], label: `${rw}" Roll Only`, sub: r.reason, ok: false, reason: r.reason };
    return {
      id: `single-${rw}`, multi: false, rws: [rw], label: `${rw}" Roll Only`,
      sub: `${r.lw.setups.length} setup${r.lw.setups.length>1?'s':''} • ${r.lw.pullCnt} pulls`,
      ok: true, lw: aggAllocs([r.lw]), fs: r.fs ? aggAllocs([r.fs]) : null
    };
  });

  const bestSingleSq = singlePlans.filter(p=>p.ok).reduce((m,p)=>Math.min(m, p.lw.filmSqIn), Infinity);
  const multiPlans = findMultiPlans(activeRolls, panes).filter(mp => !isFinite(bestSingleSq) || mp.lw.filmSqIn < bestSingleSq - 36);

  const plans = [...multiPlans, ...singlePlans].sort((a,b) => {
    if(a.ok !== b.ok) return a.ok ? -1 : 1;
    if(!a.ok && !b.ok) return b.rws[0] - a.rws[0];
    const wd = a.lw.wastePct - b.lw.wastePct;
    if(Math.abs(wd) > 0.25) return wd;
    if(a.rws.length !== b.rws.length) return a.rws.length - b.rws.length;
    if(a.lw.pullCnt !== b.lw.pullCnt) return a.lw.pullCnt - b.lw.pullCnt;
    return b.rws[0] - a.rws[0];
  });

  const best = plans[0];
  const cur = plans.find(p => p.id === S.selByFilm[fName]) || best;
  S.selByFilm[fName] = cur.id;
  let strat = S.stratByFilm[fName] || 'lw';
  if(cur.ok && strat === 'fs' && !cur.fs) strat = 'lw';
  S.stratByFilm[fName] = strat;

  const compHtml = `
    <div class="comp-grid">
      ${plans.map(p => {
        const isB = p.ok && p.id === best.id, isS = p.id === cur.id;
        if(!p.ok) return `<button type="button" data-fplan="${esc(fName)}" data-plan="${p.id}" class="c-card bad ${isS?'sel':''}"><div class="c-top"><strong class="mono" style="font-size:14px">${esc(p.label)}</strong><span class="bdg-bad mono">Too Narrow</span></div><div style="font-size:11px;color:var(--mut)">Cannot fit widest pane</div></button>`;
        return `
          <button type="button" data-fplan="${esc(fName)}" data-plan="${p.id}" class="c-card ${p.multi?'multi':''} ${isS?'sel':''}">
            <div class="c-top">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><strong class="mono" style="font-size:14px">${esc(p.label)}</strong>${p.multi?`<span class="bdg-mul mono">Multi-Roll</span>`:''}</div>
              ${isB ? `<span class="bdg-best mono">Best Choice</span>` : `<span class="mono" style="font-size:11px;color:var(--mut)">${p.lw.wastePct.toFixed(1)}% waste</span>`}
            </div>
            <div style="font-size:11px;color:var(--mut)">${esc(p.sub)}</div>
            <div class="c-stats mono">
              <div>PULL<strong class="tab">${p.lw.ft.toFixed(1)} ft</strong></div>
              <div>FILM<strong class="tab">${p.lw.filmSf.toFixed(1)} sf</strong></div>
              <div style="text-align:right">WASTE<strong class="tab" style="color:${p.lw.wastePct<=10?'var(--em2)':'var(--amb2)'}">${p.lw.wastePct.toFixed(1)}%</strong></div>
            </div>
          </button>`;
      }).join('')}
    </div>`;

  if(!cur.ok){
    return {
      activeAgg: null,
      html: `<section class="film-sec">
        <div class="film-hdr"><span class="film-bdg mono">Film ${fIdx+1}/${totalFilms}: ${esc(fName)}</span><span class="mono" style="font-size:11px;color:var(--mut)">${panes.length} pane(s)</span></div>
        ${compHtml}
        <div style="padding:10px;border-radius:11px;background:var(--ros-bg);color:var(--ros);font-size:12.5px;font-weight:700">${esc(cur.reason)}</div>
      </section>`
    };
  }

  const agg = (strat === 'fs' && cur.fs) ? cur.fs : cur.lw;
  const totSetups = agg.allocs.reduce((s,a)=>s+a.setups.length, 0);

  const stratHtml = cur.fs ? `
    <div style="padding-top:10px;border-top:1px solid var(--bdr)">
      <div class="mono" style="font-size:10px;text-transform:uppercase;color:var(--mut);font-weight:700">Blade Setup Strategy (${esc(fName)}):</div>
      <div class="strat-grid">
        <button type="button" data-fstrat="${esc(fName)}" data-strat="lw" class="s-btn ${strat==='lw'?'lw':''}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px"><strong style="font-size:12px">Lowest Waste</strong><span class="mono" style="font-size:10px;font-weight:800;padding:2px 5px;border-radius:5px;background:var(--em-bg);color:var(--em2)">${cur.lw.wastePct.toFixed(1)}%</span></div>
          <div class="mono" style="font-size:11px;color:var(--mut)">${cur.lw.pullCnt} pulls (${cur.lw.pullIn}")</div>
        </button>
        <button type="button" data-fstrat="${esc(fName)}" data-strat="fs" class="s-btn ${strat==='fs'?'fs':''}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px"><strong style="font-size:12px">Fast Split (1-Blade)</strong><span class="mono" style="font-size:10px;font-weight:800;padding:2px 5px;border-radius:5px;background:var(--cy-bg);color:var(--cy2)">${cur.fs.wastePct.toFixed(1)}%</span></div>
          <div class="mono" style="font-size:11px;color:var(--mut)">${cur.fs.pullCnt} pulls (${cur.fs.pullIn}")</div>
        </button>
      </div>
    </div>` : '';

  const stagesHtml = agg.allocs.map((rp, ri) => {
    const ban = cur.multi ? `
      <div class="roll-ban">
        <div style="display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800"><span class="bdg-mul mono">Roll ${ri+1}/${agg.allocs.length}</span><span>Load ${rp.rw}" Roll • ${esc(fName)}</span></div>
        <div class="mono" style="font-size:11px;color:var(--mut)">Pull: <strong style="color:var(--txt)">${rp.ft.toFixed(1)} ft (${rp.pullIn}")</strong> • Waste: <strong style="color:${rp.wastePct<=10?'var(--em2)':'var(--amb2)'}">${rp.wastePct.toFixed(1)}%</strong></div>
      </div>` : '';

    const stgs = rp.setups.map((st, si) => {
      const card = renderStage(`${fName}-${cur.id}`, rp, st, strat);
      if(si === 0) return card;
      const b1 = st.blades.b1 !== null ? `${st.blades.b1}"` : 'Parked';
      const b2 = st.blades.b2 !== null ? `${st.blades.b2}"` : 'Parked';
      return `<div class="shift-div"><div class="shift-ln"></div><div class="shift-bdg mono"><span>⚡ SHIFT BLADES (${rp.rw}") → Stage ${st.num}:</span><span style="color:var(--txt)">B1: ${b1} • B2: ${b2}</span></div></div>${card}`;
    }).join('');
    return ban + stgs;
  }).join('');

  return {
    activeAgg: agg,
    html: `<section class="film-sec">
      <div class="film-hdr">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="film-bdg mono">${totalFilms>1?`Film ${fIdx+1}/${totalFilms}: `:''}${esc(fName)}</span>
          <span class="mono" style="font-size:11px;color:var(--mut)">0" left stop • ${totSetups} setup${totSetups>1?'s':''}</span>
        </div>
        <span class="mono" style="font-size:11px;color:var(--mut)">${panes.length} pane(s)</span>
      </div>
      ${compHtml}
      <div class="kpi-grid mono">
        <div class="kpi"><span style="font-size:9px;color:var(--dim)">PULL</span><strong class="tab" style="font-size:14px">${agg.ft.toFixed(1)} ft</strong><span style="font-size:10px;color:var(--mut)">(${agg.pullIn}")</span></div>
        <div class="kpi"><span style="font-size:9px;color:var(--dim)">FILM</span><strong class="tab" style="font-size:14px;color:var(--cy2)">${agg.filmSf.toFixed(1)}</strong><span style="font-size:10px;color:var(--mut)">sq ft</span></div>
        <div class="kpi"><span style="font-size:9px;color:var(--dim)">GLASS</span><strong class="tab" style="font-size:14px">${agg.netSf.toFixed(1)}</strong><span style="font-size:10px;color:var(--mut)">sq ft</span></div>
        <div class="kpi"><span style="font-size:9px;color:var(--dim)">WASTE</span><strong class="tab" style="font-size:14px;color:${agg.wastePct<=10?'var(--em2)':'var(--amb2)'}">${agg.wastePct.toFixed(1)}%</strong><span style="font-size:10px;color:var(--mut)">${agg.wasteSf.toFixed(1)} sf</span></div>
      </div>
      ${stratHtml}
      ${stagesHtml}
    </section>`
  };
}

function renderStage(scopeKey, rp, st, strat){
  const { b1, b2 } = st.blades;
  const actCnt = (b1!==null?1:0) + (b2!==null?1:0);
  const pullsHtml = st.pulls.map((pl, pi) => {
    const key = `${scopeKey}-${rp.rw}-${strat}-${st.num}-${pi}`;
    const chk = !!S.checked[key];
    const rows = st.lanes.map((lw, li) => {
      const sl = pl.slots[li];
      const sIn = li===0 ? 0 : (li===1 ? st.lanes[0] : st.lanes[0]+st.lanes[1]);
      if(!sl) return `<div class="l-item drop mono"><span>L${li+1} (${sIn}"–${sIn+lw}")</span><span>Drop (${lw}"×${pl.len}")</span></div>`;
      const dH = Math.round((pl.len - sl.f.ph)*100)/100, dW = Math.round((lw - sl.f.sw)*100)/100;
      const ex = []; if(dH>0) ex.push(`+${dH}" tail`); if(dW>0) ex.push(`+${dW}" trim`);
      return `
        <div class="l-item">
          <div style="display:flex;align-items:center;gap:6px">
            <span class="mono" style="font-size:10px;font-weight:800;padding:2px 5px;border-radius:4px;background:var(--cy-bg);color:var(--cy2)">L${li+1}</span>
            <strong>${esc(sl.p.room)}</strong>
            ${sl.f.rot ? `<span class="mono" style="font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;background:var(--amb-bg);color:var(--amb2)">↻ Rotated</span>` : ''}
          </div>
          <div class="mono" style="color:var(--mut)">
            <strong style="color:var(--txt)">${sl.f.sw}"</strong>×<strong style="color:var(--txt)">${sl.f.ph}"</strong>
            ${ex.length ? `<span style="color:var(--amb2);font-size:10px"> (${ex.join(', ')})</span>` : ''}
          </div>
        </div>`;
    }).join('');

    return `
      <div class="p-card ${chk?'chk':''}" data-chk="${esc(key)}">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px">
          <div style="display:flex;align-items:center;gap:9px">
            <div class="chk-box">${chk?'✓':''}</div>
            <div class="p-ttl" style="font-size:13.5px;font-weight:800">Pull #${pi+1}: Pull <span class="mono" style="color:var(--amb2);font-size:15px">${pl.len}"</span> &amp; Cut</div>
          </div>
          <span class="mono" style="font-size:11px;color:var(--dim)">${(pl.len/12).toFixed(2)} ft</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">${rows}</div>
      </div>`;
  }).join('');

  return `
    <div class="stg-card">
      <div class="stg-hdr">
        <div style="display:flex;align-items:center;gap:7px">
          <span class="mono" style="font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;background:${rp.setups.length>1&&st.num===1?'var(--cy)':'var(--amb)'};color:#0b0f19">${rp.rw}" Roll${rp.setups.length>1?` • Stage ${st.num}/${rp.setups.length}`:''}</span>
          <span class="mono" style="font-size:12px;font-weight:700">${actCnt} Blade${actCnt!==1?'s':''} Active</span>
        </div>
        <span class="mono" style="font-size:11px;color:var(--mut)">${st.pulls.length} pull(s) • ${st.pullIn}"</span>
      </div>
      <div class="b-grid">
        <div class="b-box ${b1!==null?'b1':''}">
          <div><div class="mono" style="font-size:10px;font-weight:800;color:var(--ros)">BLADE 1</div><div style="font-size:11px;color:var(--mut)">From 0" left</div></div>
          ${b1!==null ? `<div class="b-val mono tab">${b1}"</div>` : `<div class="b-park mono">Parked</div>`}
        </div>
        <div class="b-box ${b2!==null?'b2':''}">
          <div><div class="mono" style="font-size:10px;font-weight:800;color:var(--amb2)">BLADE 2</div><div style="font-size:11px;color:var(--mut)">From 0" left</div></div>
          ${b2!==null ? `<div class="b-val mono tab">${b2}"</div>` : `<div class="b-park mono">Parked</div>`}
        </div>
      </div>
      <div class="svg-wrap">
        <div class="mono" style="display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:5px">
          <span>0" Left Stop → ${rp.rw}" Roll</span>
          <span>B1: ${b1!==null?b1+'"':'Parked'} • B2: ${b2!==null?b2+'"':'Parked'}</span>
        </div>
        ${buildSvg(rp.rw, st)}
      </div>
      <div class="pulls">
        <div class="sec-ttl mono" style="margin-bottom:1px">Sequential Pull Checklist (Tap to Check)</div>
        ${pullsHtml}
      </div>
    </div>`;
}

function buildSvg(rw, st){
  const px = 20, sc = 10, barW = MAX_W * sc, rollPx = rw * sc, svgW = barW + px*2 + 22;
  const pSc = Math.min(2.4, Math.max(1.2, 190 / (st.pullIn || 1)));
  const barY = 24, barH = 24;
  let y = barY + barH + 12;
  const blks = st.pulls.map(pl => { const h = Math.max(34, pl.len * pSc); const b = { y, h, pl }; y += h + 5; return b; });
  const svgH = y + 12;

  let ticks = '';
  for(let i=0; i<=72; i+=6){
    const x = px + i*sc, maj = i%12===0;
    ticks += `<line x1="${x}" y1="${barY}" x2="${x}" y2="${barY+(maj?11:6)}" stroke="${maj?'#94a3b8':'#475569'}" stroke-width="${maj?1.5:1}"/>`;
    if(maj) ticks += `<text x="${x}" y="${barY-5}" fill="#94a3b8" font-size="10.5" font-family="monospace" font-weight="700" text-anchor="middle">${i}"</text>`;
  }

  const cols = [
    { f:'#0e7490', s:'#22d3ee', t:'#ecfeff' },
    { f:'#1d4ed8', s:'#60a5fa', t:'#eff6ff' },
    { f:'#047857', s:'#34d399', t:'#ecfdf5' }
  ];

  let pSvg = '';
  blks.forEach(b => {
    let lx = px;
    st.lanes.forEach((lw, li) => {
      const wPx = lw * sc, sl = b.pl.slots[li], c = cols[li%3];
      if(sl){
        const mc = Math.max(4, Math.floor(lw/1.5));
        const nm = sl.p.room.length > mc ? sl.p.room.slice(0, mc)+'…' : sl.p.room;
        pSvg += `<rect x="${lx+1}" y="${b.y}" width="${wPx-2}" height="${b.h}" rx="4" fill="${c.f}" fill-opacity=".38" stroke="${c.s}" stroke-width="1.5"/>
          <text x="${lx+wPx/2}" y="${b.y+b.h/2-2}" fill="${c.t}" font-size="10.5" font-family="sans-serif" font-weight="700" text-anchor="middle">${esc(nm)}</text>
          <text x="${lx+wPx/2}" y="${b.y+b.h/2+11}" fill="${c.s}" font-size="9.5" font-family="monospace" font-weight="700" text-anchor="middle">${sl.f.sw}"×${sl.f.ph}"</text>`;
      } else {
        pSvg += `<rect x="${lx+1}" y="${b.y}" width="${wPx-2}" height="${b.h}" rx="4" fill="#1e293b" fill-opacity=".45" stroke="#475569" stroke-dasharray="4 3"/>
          <text x="${lx+wPx/2}" y="${b.y+b.h/2+3}" fill="#64748b" font-size="9.5" font-family="monospace" text-anchor="middle">DROP (${lw}"×${b.pl.len}")</text>`;
      }
      lx += wPx;
    });
    if(st.blades.sideWaste > 0){
      pSvg += `<rect x="${px+st.blades.act*sc+1}" y="${b.y}" width="${st.blades.sideWaste*sc-2}" height="${b.h}" rx="3" fill="#7f1d1d" fill-opacity=".3" stroke="#f43f5e" stroke-opacity=".5" stroke-dasharray="3 3"/>`;
    }
    pSvg += `<text x="${px+rollPx+7}" y="${b.y+b.h/2+4}" fill="#fbbf24" font-size="10.5" font-family="monospace" font-weight="800">↓${b.pl.len}"</text>`;
  });

  let bSvg = '';
  const { b1, b2 } = st.blades;
  if(b1 !== null){
    const x1 = px + b1*sc;
    bSvg += `<line x1="${x1}" y1="${barY-2}" x2="${x1}" y2="${y}" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5 3"/>
      <rect x="${x1-22}" y="${barY+barH-7}" width="44" height="16" rx="4" fill="#f43f5e"/>
      <text x="${x1}" y="${barY+barH+4}" fill="#fff" font-size="9.5" font-family="monospace" font-weight="800" text-anchor="middle">B1:${b1}"</text>`;
  }
  if(b2 !== null){
    const x2 = px + b2*sc;
    bSvg += `<line x1="${x2}" y1="${barY-2}" x2="${x2}" y2="${y}" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/>
      <rect x="${x2-22}" y="${barY+barH-7}" width="44" height="16" rx="4" fill="#f59e0b"/>
      <text x="${x2}" y="${barY+barH+4}" fill="#0b0f19" font-size="9.5" font-family="monospace" font-weight="800" text-anchor="middle">B2:${b2}"</text>`;
  }

  return `<svg viewBox="0 0 ${svgW} ${svgH}">
    <rect x="${px}" y="${barY}" width="${barW}" height="${barH}" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    ${rw<72 ? `<text x="${px+rollPx+(barW-rollPx)/2}" y="${barY+16}" fill="#64748b" font-size="9.5" font-family="monospace" text-anchor="middle">Empty Bar (${72-rw}")</text>` : ''}
    <rect x="${px}" y="${barY+12}" width="${rollPx}" height="${barH-12}" rx="2" fill="#334155"/>
    <text x="${px+5}" y="${barY+21}" fill="#e2e8f0" font-size="9" font-family="monospace" font-weight="700">${rw}" ROLL (0"–${rw}")</text>
    ${ticks}${pSvg}${bSvg}
  </svg>`;
}

/* Event Bindings */
document.addEventListener('DOMContentLoaded', () => {
  try {
    setTheme(localStorage.getItem('hc_theme') || 'dark');
    S.shop = localStorage.getItem('hc_shop') || '';
  } catch(_){ setTheme('dark'); }
  renderShop();

  $('btn-theme').onclick = () => {
    const nx = document.body.classList.contains('light') ? 'dark' : 'light';
    setTheme(nx); toast(nx === 'light' ? 'Light mode' : 'Dark mode');
  };
  $('btn-shop-save').onclick = () => saveShop($('shop-in').value);
  $('btn-shop-clr').onclick = () => saveShop('');
  $('shop-in').onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); saveShop($('shop-in').value); } };

  $('btn-demo').onclick = () => {
    S.wins = [
      { id: uid++, film: 'Blackout', room: 'Front Windows', qty: 2, w: 12, h: 20 },
      { id: uid++, film: 'Blackout', room: 'Side Glass', qty: 4, w: 10, h: 18 },
      { id: uid++, film: 'Ceramic 35', room: 'Living Room', qty: 4, w: 18, h: 36 },
      { id: uid++, film: 'Ceramic 35', room: 'Slider', qty: 2, w: 18, h: 70 },
      { id: uid++, film: 'White Frost', room: 'Bathroom', qty: 2, w: 30, h: 56 }
    ];
    S.rollsByFilm = {
      'Blackout': [{ w:72,on:false,cust:false },{ w:60,on:true,cust:false },{ w:48,on:false,cust:false },{ w:36,on:false,cust:false }],
      'Ceramic 35': [{ w:72,on:true,cust:false },{ w:60,on:false,cust:false },{ w:48,on:false,cust:false },{ w:36,on:true,cust:false }],
      'White Frost': [{ w:72,on:true,cust:false },{ w:60,on:true,cust:false },{ w:48,on:false,cust:false },{ w:36,on:true,cust:false }]
    };
    S.activeFilm = 'Blackout';
    S.bleed = 0; S.trim = 4; S.tail = 4; S.selByFilm = {}; S.stratByFilm = {}; S.checked = {};
    syncTrim(); syncTail(); setBleed(0, false); renderWins(); renderAll();
    toast('Demo queue loaded');
  };

  $('b-0').onclick = () => setBleed(0);
  $('b-1').onclick = () => setBleed(1);
  document.querySelectorAll('[data-trim]').forEach(b => b.onclick = () => {
    S.trim = +b.dataset.trim; S.selByFilm = {}; S.checked = {}; syncTrim(); renderAll();
    toast(`Max side-trim: ${S.trim}"`);
  });
  document.querySelectorAll('[data-tail]').forEach(b => b.onclick = () => {
    S.tail = +b.dataset.tail; S.selByFilm = {}; S.checked = {}; syncTail(); renderAll();
    toast(`Max tail allowance: ${S.tail}"`);
  });

  $('roll-grid').onclick = e => {
    const curFilm = getCurrentFilm();
    const list = curFilm ? getRollsForFilm(curFilm) : S.defaultRolls;
    const rm = e.target.closest('[data-rm]');
    if(rm){
      e.stopPropagation();
      const idx = list.findIndex(r => r.w === +rm.dataset.rm);
      if(idx !== -1) list.splice(idx, 1);
      if(curFilm) delete S.selByFilm[curFilm];
      renderRolls(); renderAll(); return;
    }
    const tg = e.target.closest('[data-tog]');
    if(tg){
      const r = list.find(x => x.w === +tg.dataset.tog);
      if(r){ r.on = !r.on; if(curFilm) delete S.selByFilm[curFilm]; renderRolls(); renderAll(); }
    }
  };

  $('btn-add-roll').onclick = () => {
    const v = parseFloat($('cust-roll').value);
    if(isNaN(v) || v < 10 || v > 72) return toast('Enter width 10"–72"');
    const curFilm = getCurrentFilm();
    const list = curFilm ? getRollsForFilm(curFilm) : S.defaultRolls;
    const ex = list.find(r => r.w === v);
    if(ex) ex.on = true; else list.push({ w: v, on: true, cust: true });
    $('cust-roll').value = '';
    if(curFilm) delete S.selByFilm[curFilm];
    renderRolls(); renderAll();
    toast(`Added ${v}" roll${curFilm ? ` for ${curFilm}` : ''}`);
  };

  $('sample-notes').onclick = e => {
    const btn = e.target.closest('[data-sample]');
    if(!btn) return;
    $('paste-txt').value = btn.dataset.sample === 'queue'
      ? `Blackout\n(2) 12x20\n(4) 10x18\nCeramic 35\n(4) 18x36\n(2) 18x70\nWhite Frost\n(2) 30x56`
      : `Black film-front\nTransom - (1) 36x27\ndoor (1) 28x70\nTop Sides (2) 30x27\n\nDR 20\nSlider (2) 24x34\n\nFrost\nBath Window (2) 18x24`;
  };

  $('btn-paste-tog').onclick = () => { $('paste-box').classList.toggle('hidden'); if(!$('paste-box').classList.contains('hidden')) $('paste-txt').focus(); };
  $('btn-paste-x').onclick = () => $('paste-box').classList.add('hidden');
  $('btn-paste-app').onclick = () => parsePaste(false);
  $('btn-paste-rep').onclick = () => parsePaste(true);

  $('btn-clr-win').onclick = () => { S.wins = []; S.activeFilm = ''; S.selByFilm = {}; S.stratByFilm = {}; S.checked = {}; renderWins(); renderAll(); };
  $('btn-add-win').onclick = () => {
    const last = S.wins[S.wins.length-1];
    S.wins.push({ id: uid++, film: last ? last.film : 'Ceramic 35', room: last ? last.room : 'Room', qty: 1, w: 24, h: 36 });
    renderWins(); renderAll();
  };
  $('btn-add-grp').onclick = () => {
    const used = new Set(S.wins.map(w => (w.film || '').trim()));
    const picks = ['Blackout', 'Ceramic 35', 'White Frost', 'Dual Reflective (DR)', 'Evening View (EV)', 'Security'];
    const nextFilm = picks.find(p => !used.has(p)) || `Film Group ${used.size + 1}`;
    S.wins.push({ id: uid++, film: nextFilm, room: 'New Area', qty: 1, w: 24, h: 36 });
    S.activeFilm = nextFilm;
    renderWins(); renderAll();
    toast(`Added ${nextFilm} group`);
  };

  $('w-list').onchange = e => {
    const row = e.target.closest('.w-row'); if(!row) return;
    const w = S.wins.find(x => x.id === +row.dataset.id); if(!w) return;
    const f = e.target.dataset.f;
    if(f === 'film'){ w.film = e.target.value; S.activeFilm = w.film.trim() || 'Standard Film'; }
    else if(f === 'room') w.room = e.target.value;
    else if(f === 'qty') w.qty = Math.max(1, parseInt(e.target.value,10)||1);
    else if(f === 'w') w.w = Math.max(1, parseFloat(e.target.value)||1);
    else if(f === 'h') w.h = Math.max(1, parseFloat(e.target.value)||1);
    S.selByFilm = {}; updateSum(); renderAll();
  };

  $('w-list').onclick = e => {
    const dl = e.target.closest('[data-del]'); if(!dl) return;
    S.wins = S.wins.filter(x => x.id !== +dl.dataset.del);
    S.selByFilm = {}; renderWins(); renderAll();
  };

  $('results').onclick = e => {
    const qf = e.target.closest('[data-qfilm]');
    if(qf){ S.activeFilm = qf.dataset.qfilm; renderAll(); $('results').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const pl = e.target.closest('[data-plan]');
    if(pl){ const fn = pl.dataset.fplan; if(fn) S.selByFilm[fn] = pl.dataset.plan; renderAll(); return; }
    const st = e.target.closest('[data-strat]');
    if(st){ const fn = st.dataset.fstrat; if(fn) S.stratByFilm[fn] = st.dataset.strat; renderAll(); return; }
    const ck = e.target.closest('[data-chk]');
    if(ck){ S.checked[ck.dataset.chk] = !S.checked[ck.dataset.chk]; renderAll(); }
  };

  renderRolls(); syncTrim(); syncTail(); renderWins(); renderAll();
});
})();
</script>
</body>
</html>
